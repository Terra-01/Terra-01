<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="44" height="44" role="img" aria-label="X" style="--d: 4.8s; display: block">
<style>
@keyframes draw{to{stroke-dashoffset:0}}
.ink *{stroke-dasharray:80;stroke-dashoffset:80;animation:draw 1.1s cubic-bezier(.5,0,.3,1) var(--d) forwards}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.spot,.spot-line{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .5s cubic-bezier(.3,1.6,.5,1) calc(var(--d) + .8s) forwards}
@keyframes nod{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-8deg)}95%{transform:rotate(6deg)}}
.wig{transform-origin:24px 24px;animation:nod 6s ease-in-out calc(var(--d) + 2s) infinite}
@media (prefers-reduced-motion: reduce){.ink *,.spot,.spot-line,.wig{animation:none!important;stroke-dashoffset:0;transform:none}}
</style>
<filter id="wob-x-light" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0.9" xChannelSelector="R" yChannelSelector="G"/></filter>
<g class="wig"><g transform="translate(6 6) scale(1.5)" filter="url(#wob-x-light)" style="fill: none; stroke: #1f2328; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round">
<g class="ink"><path d="M4.4 6.4c0-1 .8-1.8 1.8-1.8h11.6c1 0 1.8.8 1.8 1.8v7.6c0 1-.8 1.8-1.8 1.8h-6.4l-4 3.4v-3.4h-1.2c-1 0-1.8-.8-1.8-1.8z"/><circle cx="8.6" cy="10.2" r=".5"/><circle cx="15.4" cy="10.2" r=".5"/></g>
<g style="fill: #e8689f; stroke: none"><circle class="spot" cx="12" cy="10.2" r="1.25"/></g>
</g></g>
</svg>